<!doctype html><html><head><meta charset="utf-8"><title>Evaluation Assignments</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="bg-light">
{% include "admin_nav.html" %}<div class="container py-4"><div class="d-flex justify-content-between"><div><h2>Evaluation Assignments</h2><p>{{batch.batch_name}} · {{scheme.name}}</p></div><a href="{{url_for('admin_evaluation_settings')}}" class="btn btn-outline-primary">Settings</a></div><div class="card p-4 mb-4"><form method="post" class="row g-2"><input type="hidden" name="action" value="add"><div class="col-md-5"><select name="team_id" class="form-select" required><option value="">Select Team</option>{% for t in teams %}<option value="{{t.id}}">{{t.team_name}} — {{t.leader_department}} / {{t.leader_section}}</option>{% endfor %}</select></div><div class="col-md-5"><select name="faculty_id" class="form-select" required><option value="">Select Evaluator</option>{% for f in faculty %}<option value="{{f.id}}">{{f.name}}{% if f.department %} — {{f.department}}{% endif %}</option>{% endfor %}</select></div><div class="col-md-2"><button class="btn btn-primary w-100">Assign</button></div></form></div><table class="table table-bordered bg-white"><thead><tr><th>Team</th><th>Evaluator</th><th>Action</th></tr></thead><tbody>{% for a in assignments %}<tr><td>{{a.team_name}}</td><td>{{a.faculty_name}}</td><td><form method="post"><input type="hidden" name="action" value="remove"><input type="hidden" name="team_id" value="{{a.team_id}}"><input type="hidden" name="faculty_id" value="{{a.faculty_id}}"><button class="btn btn-sm btn-danger">Remove</button></form></td></tr>{% else %}<tr><td colspan="3">No additional evaluator assignments.</td></tr>{% endfor %}</tbody></table></div></body></html>
