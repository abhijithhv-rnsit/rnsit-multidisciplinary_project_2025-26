<!DOCTYPE html>
<html>
<head>
    <title>My Registration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-primary px-3">
    <a class="navbar-brand" href="/student/home">Student Dashboard</a>
    <a href="/student/logout" class="btn btn-light btn-sm">Logout</a>
</nav>

<div class="container mt-4">
    <h4 class="mb-4">My Registered Project</h4>

    {% if registration %}
        <div class="card shadow-sm">
            <div class="card-body">
                <h5 class="card-title">{{ registration.problem_title }}</h5>
                <p class="mb-2">
                    <strong>Team Name:</strong> {{ registration.team_name }}
                </p>
                <p class="text-muted">
                    <strong>Leader USN:</strong> {{ registration.leader_usn }}
                </p>
            </div>
        </div>
    {% else %}
        <div class="alert alert-warning">
            You have not registered for any project yet.
        </div>
    {% endif %}
</div>

</body>
</html>
