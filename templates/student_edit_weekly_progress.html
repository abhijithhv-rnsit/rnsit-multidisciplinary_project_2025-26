{% extends "student_base.html" %}
{% block title %}Edit Weekly Progress{% endblock %}

{% block content %}

<div class="container mt-3">

  <h4 class="mb-3">Edit Weekly Progress</h4>

  <div class="alert alert-warning">
    You can edit only while status is <b>Pending</b>. Once faculty reviews, editing is locked.
  </div>

  <div class="card shadow-sm p-3">
    <h6 class="mb-2">Week {{ p.week_no }}</h6>

    <form method="post">
      <div class="mb-3">
        <label class="form-label"><strong>Progress Description</strong></label>
        <textarea name="progress" class="form-control" rows="5" required>{{ p.progress }}</textarea>
      </div>

      <div class="d-flex gap-2">
        <button class="btn btn-success">Save Changes</button>
        <a href="/student/weekly-progress" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </form>
  </div>

</div>

{% endblock %}
