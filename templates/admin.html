<!DOCTYPE html>
<html>
<head>
  <title>Admin Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">

      <div class="text-center mb-4">
        <img src="{{ url_for('static', filename='rnsit_logo.png') }}" height="60" class="mb-2">
        <h4 class="fw-bold mb-1">RNSIT Multidisciplinary Projects</h4>
        <p class="text-muted mb-0">Admin Login</p>
      </div>

      <div class="card shadow-sm border-0 rounded-4">
        <div class="card-body p-4">

          {% with messages = get_flashed_messages() %}
            {% if messages %}
              <div class="alert alert-danger">{{ messages[0] }}</div>
            {% endif %}
          {% endwith %}

          <form method="post">
            <div class="mb-3">
              <label class="form-label fw-semibold">Username</label>
              <input type="text" name="u" class="form-control" placeholder="Enter admin username" required>
            </div>

            <div class="mb-3">
              <label class="form-label fw-semibold">Password</label>
              <input type="password" name="p" class="form-control" placeholder="Enter password" required>
            </div>

            <button class="btn btn-primary w-100 fw-semibold">
              Login
            </button>
          </form>

          <div class="text-center mt-3">
            <a href="/" class="text-decoration-none small">← Back to Home</a>
          </div>

        </div>
      </div>

      <p class="text-center text-muted small mt-4">
        © RNSIT Multidisciplinary Projects 2025–26
      </p>

    </div>
  </div>
</div>

</body>
</html>
