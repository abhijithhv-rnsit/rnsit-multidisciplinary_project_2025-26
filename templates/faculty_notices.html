<!DOCTYPE html>
<html>
<head>
  <title>Faculty Notices</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

{% include "faculty_nav.html" %}

<div class="container mt-4">

<h4 class="fw-bold mb-3">📢 Notices</h4>

{% if notices %}
  {% for n in notices %}
  <div class="card shadow-sm mb-3">
    <div class="card-body">

      <div class="d-flex justify-content-between">
        <h6 class="fw-bold mb-1">{{ n["title"] }}</h6>

        {% if n["department"] %}
          <span class="badge bg-info">{{ n["department"] }}</span>
        {% else %}
          <span class="badge bg-secondary">All</span>
        {% endif %}
      </div>

      <div class="text-muted small mb-2">{{ n["created_at"] }}</div>
      <p class="mb-0">{{ n["content"] }}</p>

    </div>
  </div>
  {% endfor %}
{% else %}
  <div class="alert alert-warning">No notices available.</div>
{% endif %}

</div>

</body>
</html>
