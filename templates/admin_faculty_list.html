<!DOCTYPE html>
<html>
<head>
  <title>Faculty List</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<!--<nav class="navbar navbar-dark bg-dark px-3">
  <a class="navbar-brand" href="/admin/home">Admin Panel</a>
  <a href="/admin/logout" class="btn btn-light btn-sm">Logout</a>
</nav>-->
  {% include "admin_nav.html" %}

<div class="container mt-4">
  <h4 class="mb-3">Faculty List</h4>

  {% with messages = get_flashed_messages() %}
    {% if messages %}
      <div class="alert alert-info">{{ messages[0] }}</div>
    {% endif %}
  {% endwith %}

  <div class="table-responsive">
    <table class="table table-bordered table-striped">
      <thead class="table-dark">
        <tr>
          <th>Name</th>
          <th>Email</th>
          <th>Department</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody>
        {% for f in faculty %}
        <tr>
          <td>{{ f.name }}</td>
          <td>{{ f.email }}</td>
          <td>{{ f.department }}</td>
          <td>
            <a class="btn btn-danger btn-sm"
               href="/admin/faculty/delete/{{ f.id }}"
               onclick="return confirm('Delete this faculty?')">
              Delete
            </a>
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>

</div>

</body>
</html>
