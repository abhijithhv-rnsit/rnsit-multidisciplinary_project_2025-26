<!DOCTYPE html>
<html>
<head>
  <title>Bulk Faculty Upload</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

{% include "admin_nav.html" %}

<div class="container mt-4">

  <div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="mb-0">Bulk Faculty Upload</h4>
    <a href="/admin/home" class="btn btn-outline-secondary btn-sm">← Back</a>
  </div>

  {% with messages = get_flashed_messages() %}
    {% if messages %}
      <div class="alert alert-info">{{ messages[0] }}</div>
    {% endif %}
  {% endwith %}

  <div class="card shadow-sm border-0">
    <div class="card-body">

      <p class="text-muted mb-2">
        Upload an Excel file with columns:
        <b>Name</b>, <b>Email</b>, <b>Department</b>
      </p>

      <form method="post" enctype="multipart/form-data">
        <div class="mb-3">
          <label class="form-label fw-semibold">Upload Excel File</label>
          <input type="file" name="file" class="form-control" accept=".xlsx" required>
        </div>

        <button class="btn btn-primary">
          Upload & Create Faculty Accounts
        </button>
      </form>

    </div>
  </div>

</div>

</body>
</html>
