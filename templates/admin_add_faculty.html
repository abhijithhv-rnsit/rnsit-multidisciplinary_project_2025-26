<!DOCTYPE html>
<html>
<head>
    <title>Add Faculty</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    {% include "admin_nav.html" %}

<div class="container mt-4" style="max-width:500px;">
    <h4 class="mb-3">Add Faculty</h4>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="alert alert-info">{{ messages[0] }}</div>
      {% endif %}
    {% endwith %}

    <form method="post">
        <input name="name" class="form-control mb-3" placeholder="Faculty Name" required>
        <input name="email" class="form-control mb-3" placeholder="Faculty Email" required>
        <input name="department" class="form-control mb-3" placeholder="Department" required>
        <input name="password" type="password" class="form-control mb-3" placeholder="Password" required>

        <button class="btn btn-primary w-100">Create Faculty</button>
    </form>
</div>

</body>
</html>
