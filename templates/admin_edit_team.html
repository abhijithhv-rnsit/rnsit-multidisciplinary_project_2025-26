<!DOCTYPE html>
<html>
<head>
  <title>Edit Team</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

{% include "admin_nav.html" %}

<div class="container mt-4">

<h4 class="fw-bold mb-3">Edit Team — {{ team.team_name }}</h4>

<form method="post" class="card p-4 shadow-sm">

<!-- ================= TEAM + LEADER DETAILS ================= -->
<div class="row g-3 mb-3">

  <div class="col-md-4">
    <label class="fw-semibold">Team Name</label>
    <input class="form-control" name="team_name" value="{{ team.team_name }}" required>
  </div>

  <div class="col-md-4">
    <label class="fw-semibold">Leader Name</label>
    <input class="form-control" name="leader_name" value="{{ team.leader_name }}" required>
  </div>

  <div class="col-md-4">
    <label class="fw-semibold">Leader USN</label>
    <input class="form-control" name="leader_usn" value="{{ team.leader_usn }}" required>
  </div>

  <div class="col-md-4">
    <label class="fw-semibold">Leader Email</label>
    <input class="form-control" name="leader_email" value="{{ team.leader_email }}" required>
  </div>

  <div class="col-md-3">
    <label class="fw-semibold">Leader Phone</label>
    <input class="form-control" name="leader_phone" value="{{ team.leader_phone }}">
  </div>

  <div class="col-md-3">
    <label class="fw-semibold">Leader Department</label>
    <select class="form-select" name="leader_department" required>
      <option value="CSE" {% if team.leader_department=="CSE" %}selected{% endif %}>CSE</option>
      <option value="CSE-AIML" {% if team.leader_department=="CSE-AIML" %}selected{% endif %}>CSE-AIML</option>
      <option value="CSE-DS" {% if team.leader_department=="CSE-DS" %}selected{% endif %}>CSE-DS</option>
      <option value="CSE-CY" {% if team.leader_department=="CSE-CY" %}selected{% endif %}>CSE-CY</option>
      <option value="ECE" {% if team.leader_department=="ECE" %}selected{% endif %}>ECE</option>
      <option value="EEE" {% if team.leader_department=="EEE" %}selected{% endif %}>EEE</option>
      <option value="ME" {% if team.leader_department=="ME" %}selected{% endif %}>ME</option>
      <option value="CV" {% if team.leader_department=="CV" %}selected{% endif %}>CV</option>
    </select>
  </div>

  <div class="col-md-2">
    <label class="fw-semibold">Leader Section</label>
    <input class="form-control" name="leader_section" value="{{ team.leader_section }}">
  </div>

</div>

<hr>

<!-- ================= TEAM MEMBERS ================= -->
<h6 class="fw-bold mb-2">Team Members</h6>

{% for i in range(1,7) %}
{% set m = members[i-1] if i-1 < members|length else None %}

<div class="row g-2 mb-2">

  <div class="col-md-2">
    <input class="form-control" name="member{{i}}_name"
           placeholder="Name"
           value="{{ m.member_name if m }}">
  </div>

  <div class="col-md-2">
    <input class="form-control" name="member{{i}}_usn"
           placeholder="USN"
           value="{{ m.usn if m }}">
  </div>

  <div class="col-md-3">
    <input class="form-control" name="member{{i}}_email"
           placeholder="Email"
           value="{{ m.email if m }}">
  </div>

  <div class="col-md-2">
    <input class="form-control" name="member{{i}}_phone"
           placeholder="Phone"
           value="{{ m.phone if m }}">
  </div>

  <div class="col-md-2">
    <input class="form-control" name="member{{i}}_department"
           placeholder="Dept"
           value="{{ m.department if m }}">
  </div>

  <div class="col-md-1">
    <input class="form-control" name="member{{i}}_section"
           placeholder="Sec"
           value="{{ m.section if m }}">
  </div>

</div>

{% endfor %}

<!-- ================= ACTION BUTTONS ================= -->
<div class="mt-3 d-flex gap-2">
  <button class="btn btn-success">💾 Save Changes</button>
  <a href="/admin/teams" class="btn btn-secondary">Cancel</a>
</div>

</form>

</div>

</body>
</html>
