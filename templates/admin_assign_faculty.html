<!DOCTYPE html>
<html>
<head>
    <title>Assign Faculty to Team</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark px-3">
    <a class="navbar-brand" href="/admin/home">Admin Panel</a>
    <a href="/admin/logout" class="btn btn-light btn-sm">Logout</a>
</nav>

<div class="container mt-4">
    <h4 class="mb-3">Assign Faculty Guide</h4>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="alert alert-info">{{ messages[0] }}</div>
      {% endif %}
    {% endwith %}

    <form method="post" class="card p-3 shadow-sm">
        <div class="mb-3">
            <label class="form-label">Select Team</label>
            <select name="team_id" class="form-select" required>
                {% for t in teams %}
                    <option value="{{ t.id }}">
                        {{ t.team_name }} ({{ t.leader_usn }})
                    </option>
                {% endfor %}
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Select Faculty</label>
            <select name="faculty_id" class="form-select" required>
                {% for f in faculty %}
                    <option value="{{ f.id }}">
                        {{ f.name }} ({{ f.department }})
                    </option>
                {% endfor %}
            </select>
        </div>

        <button class="btn btn-primary">Assign Faculty</button>
    </form>
</div>

</body>
</html>
