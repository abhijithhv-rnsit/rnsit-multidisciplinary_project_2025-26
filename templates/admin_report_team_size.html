<!DOCTYPE html><html><head><title>Team Sizes</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="bg-light">{% include "admin_nav.html" %}<div class="container mt-4"><a href="{{ url_for('admin_reports') }}" class="btn btn-outline-secondary btn-sm mb-3">← Back to Reports</a><div class="d-flex justify-content-between align-items-center mb-3"><div><h4 class="fw-bold">Team Sizes</h4><div class="text-muted">Batch: {{ view_batch.academic_year }}</div></div><a href="{{ url_for('export_team_size') }}" class="btn btn-success">Download Excel</a></div><div class="table-responsive card p-3"><table class="table table-striped table-bordered align-middle"><thead><tr><th>Sl. No.</th><th>Team Name</th><th>Team Leader</th><th>Total Students</th></tr></thead><tbody>{% for t in team_sizes %}<tr><td>{{ loop.index }}</td><td>{{ t.team_name }}</td><td>{{ t.leader_name }}</td><td>{{ t.total_students }}</td></tr>{% else %}<tr><td colspan="4" class="text-center text-muted">No teams found.</td></tr>{% endfor %}</tbody></table></div></div></body></html>
