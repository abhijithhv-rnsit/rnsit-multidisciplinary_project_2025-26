<!DOCTYPE html>
<html>
<head>
    <title>Project Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-primary px-3">
    <a class="navbar-brand" href="/student/home">Student Dashboard</a>
    <a href="/student/logout" class="btn btn-light btn-sm">Logout</a>
</nav>

<div class="container mt-4">
    <h4 class="mb-3">Project Abstract & Objectives</h4>

    <form method="post">
        <div class="mb-3">
            <label class="form-label"><strong>Abstract</strong></label>
            <textarea class="form-control" name="abstract" rows="5" required>{{ details.abstract if details }}</textarea>
        </div>

        <div class="mb-3">
            <label class="form-label"><strong>Objectives</strong></label>
            <textarea class="form-control" name="objectives" rows="5" required>{{ details.objectives if details }}</textarea>
        </div>

        <button class="btn btn-primary">
            Save Project Details
        </button>
    </form>

    {% if details %}
        <div class="alert alert-success mt-3">
            Project details saved. You can edit them anytime.
        </div>
    {% endif %}
</div>

</body>
</html>
